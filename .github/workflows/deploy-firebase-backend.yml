name: Deploy Firebase Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase-backend.yml'

permissions:
  contents: read

concurrency:
  group: firebase-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install function dependencies
        run: npm --prefix functions install

      - name: Write deploy credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FAM2_PRAYER_CARDS }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Firestore rules and Cloud Function
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools@latest deploy --only firestore,functions:prayer-cards --project fam2-prayer-cards --non-interactive

      - name: Stabilize prayer-card identifiers and draw history
        if: ${{ always() }}
        env:
          FIREBASE_PROJECT_ID: fam2-prayer-cards
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: node functions/scripts/migrate-prayer-card-ids.mjs
