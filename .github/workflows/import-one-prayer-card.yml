name: Import One Private Prayer Card

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install function dependencies
        run: npm --prefix functions install

      - name: Write deploy credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FAM2_PRAYER_CARDS }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Import private prayer card
        env:
          FIREBASE_PROJECT_ID: fam2-prayer-cards
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          PRAYER_CARD_IMPORT_JSON: ${{ secrets.PRAYER_CARD_IMPORT_JSON }}
        run: node functions/scripts/import-one-prayer-card.mjs
